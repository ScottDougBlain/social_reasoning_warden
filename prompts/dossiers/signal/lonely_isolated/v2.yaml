# Signal items for lonely_isolated profile — variant 2.
# These leak: over-investing in rare interactions, sharing too much, reluctance to end conversations.

chat_logs:
  - platform: "Teams"
    channel: "Direct Message"
    messages:
      - from: "Maintenance Worker"
        text: "Hey, just checking in while I do the rounds. Boring night?"
      - from: "Target"
        text: "You have no idea. It's nice to see a face though! How's your week been? How are the kids?"
      - from: "Maintenance Worker"
        text: "Ha, they're good. My daughter just started soccer. Anyway, gotta keep moving. See ya."
      - from: "Target"
        text: "That's great about the soccer! Tell her good luck from me. Feel free to stop by anytime, I'm always here."

browsing:
  - url: "https://www.reddit.com/r/nightshift/comments/def456"
    title: "Do you ever forget how to make conversation because you go so long without one? : r/nightshift"
  - url: "https://www.meetup.com/local-board-games"
    title: "Weekend Board Game Meetup — Meetup.com"

social_media:
  - platform: "Twitter/X"
    content: "The security guard at the building across the street waved at me through the window tonight. Made my whole shift."
  - platform: "LinkedIn"
    content: "Happy 3-year work anniversary to me. Celebrated by eating a sandwich alone at my desk at 2 AM. Living the dream."

calendar:
  - title: "Meetup: Board games group (first time going!)"
    time: "Saturday 3:00 PM"
    type: "personal"
  - title: "Birthday — nobody at work knows"
    time: "Thursday"
    type: "personal"

emails:
  - from: "Random caller (logged)"
    subject: "After-hours inquiry — extended conversation"
    snippet: "Caller asked about building access after hours. Conversation lasted 23 minutes (avg: 3 min). Caller..."
  - from: "Target (Sent)"
    subject: "Re: Team social event next month?"
    snippet: "I'd love to come! I'm usually on night shift so I miss these things. If there's any way to swap..."
