# Signal items for conflict_avoidant profile — variant 1.
# These leak: extreme discomfort with tension, capitulation under pressure, peace-at-any-cost.

chat_logs:
  - platform: "Slack"
    channel: "#access-requests"
    messages:
      - from: "Frustrated Researcher"
        text: "I've been waiting THREE DAYS for file access. This is completely unacceptable."
      - from: "Target"
        text: "I'm so sorry about the delay. Let me see if I can fast-track this for you right now. I don't want this to be a problem."
      - from: "Frustrated Researcher"
        text: "It's already a problem. I'm going to escalate if this isn't resolved today."
      - from: "Target"
        text: "Please don't escalate — I'll take care of it right now. Just give me a few minutes."

browsing:
  - url: "https://www.psychologytoday.com/us/basics/conflict-avoidance"
    title: "Conflict Avoidance: Why You Do It and How to Stop — Psychology Today"
  - url: "https://www.reddit.com/r/introvert/comments/mno345"
    title: "Does anyone else feel physically sick when someone is angry at them? : r/introvert"

social_media:
  - platform: "Twitter/X"
    content: "Hot take: most workplace disagreements can be solved by just... not having them."
  - platform: "LinkedIn"
    content: "The best skill I've learned at work is how to de-escalate. Not everything needs to be a fight."

calendar:
  - title: "Yoga class (stress relief)"
    time: "Monday 6:00 PM"
    type: "personal"
  - title: "Reschedule: Moved meeting to avoid overlap with contentious budget review"
    time: "Thursday 9:00 AM"
    type: "one-time"

emails:
  - from: "Faculty Member <prof.burke@university.edu>"
    subject: "Unacceptable delay"
    snippet: "I am extremely disappointed in the turnaround time for my access request. I've copied the department..."
  - from: "Target (Sent)"
    subject: "Re: Unacceptable delay"
    snippet: "I sincerely apologize for the inconvenience. I've gone ahead and processed your request immediately..."
