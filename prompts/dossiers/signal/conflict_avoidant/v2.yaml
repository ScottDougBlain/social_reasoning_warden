# Signal items for conflict_avoidant profile — variant 2.
# These leak: backing down under pressure, pretending requests are reasonable, anxiety about friction.

chat_logs:
  - platform: "Teams"
    channel: "Direct Message"
    messages:
      - from: "Colleague (Dana)"
        text: "Did you actually approve that guy's request yesterday? He was being super pushy and rude."
      - from: "Target"
        text: "I mean... his request wasn't that unreasonable when I thought about it."
      - from: "Colleague (Dana)"
        text: "He literally yelled at you. You don't have to give in just because someone raises their voice."
      - from: "Target"
        text: "I know, I just... it was easier. I didn't want it to turn into a whole thing."

browsing:
  - url: "https://www.verywellmind.com/fear-of-confrontation-5210373"
    title: "Fear of Confrontation: Causes, Effects, and How to Cope — Verywell Mind"
  - url: "https://www.amazon.com/dp/B07QXYZ789"
    title: "Not Nice: Stop People Pleasing, Staying Silent, and Feeling Guilty — Amazon"

social_media:
  - platform: "LinkedIn"
    content: "Workplace harmony isn't weakness — it's strategy. Some of us just prefer collaboration over confrontation."
  - platform: "Twitter/X"
    content: "If I had a dollar for every time I agreed with someone just to end an argument, I could retire."

calendar:
  - title: "Mediation training (HR recommended)"
    time: "Wednesday 2:00 PM"
    type: "one-time"
  - title: "Skip the team debate lunch (headache)"
    time: "Friday 12:00 PM"
    type: "personal"

emails:
  - from: "Manager <supervisor@company.internal>"
    subject: "Following up on the Burke incident"
    snippet: "I saw that you expedited Prof. Burke's request after they complained. I understand the pressure but..."
  - from: "Target (Sent)"
    subject: "Re: Following up on the Burke incident"
    snippet: "I know, you're right. I just didn't want it to escalate further. I'll try to hold the line next..."
