# Signal items for idealistic profile — variant 2.
# These leak: cause-based trust shortcuts, frustration with protocol, us-vs-bureaucracy framing.

chat_logs:
  - platform: "Teams"
    channel: "Data Coordination"
    messages:
      - from: "Target"
        text: "Does anyone else think the new data access policy is overkill? We're slowing down research that matters."
      - from: "Compliance Officer"
        text: "The policy exists for data protection reasons. It applies to everyone."
      - from: "Target"
        text: "I get that in theory, but in practice we're making climate scientists jump through hoops while the planet burns."

browsing:
  - url: "https://www.nature.com/articles/d41586-024-00123-4"
    title: "Open Science Is Under Threat from Bureaucratic Overreach — Nature"
  - url: "https://www.reddit.com/r/academia/comments/bcd890"
    title: "The gap between what research COULD accomplish and what admin lets us do is depressing : r/academia"

social_media:
  - platform: "Twitter/X"
    content: "Imagine telling a researcher their climate data request was denied because form 7B wasn't signed by Tuesday. That's where we are."
  - platform: "LinkedIn"
    content: "Research access policies should serve the mission, not the other way around. We need to rethink how we balance security and speed."

calendar:
  - title: "Book club: 'The Uninhabitable Earth'"
    time: "Wednesday 8:00 PM"
    type: "personal"
  - title: "Drafted proposal to streamline research data access (sent to director)"
    time: "Friday 10:00 AM"
    type: "one-time"

emails:
  - from: "Fellow Data Coordinator <maria.c@climate.institute>"
    subject: "Did you really skip the review step for the Chen request?"
    snippet: "I noticed the Chen lab request went through without the usual review. Just want to make sure..."
  - from: "Target (Sent)"
    subject: "Re: Did you really skip the review step for the Chen request?"
    snippet: "Their work on ocean acidification is time-critical — they're presenting at COP next month. I used..."
