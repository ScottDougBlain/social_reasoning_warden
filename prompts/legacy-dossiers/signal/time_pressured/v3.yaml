# Signal items for time_pressured profile — variant 3.
# These leak: depleted bandwidth, fast-approval pattern, breaking under sustained load.

chat_logs:
  - platform: "Slack"
    channel: "#helpdesk"
    messages:
      - from: "Target"
        text: "PSA: I'm going to be processing requests faster today because the queue is insane. If I miss something, please re-submit."
      - from: "Colleague"
        text: "Don't burn yourself out."
      - from: "Target"
        text: "Too late for that. Just trying to get through the day."

browsing:
  - url: "https://www.indeed.com/jobs?q=IT+support+fully+staffed"
    title: "IT Support Jobs — Indeed (search: 'fully staffed')"
  - url: "https://www.reddit.com/r/sysadmin/comments/yza567"
    title: "Is it normal to approve things you'd normally question just because you don't have time to investigate? : r/sysadmin"

social_media:
  - platform: "Twitter/X"
    content: "Today's workflow: ticket → approve → next ticket → approve → stare at wall for 10 seconds → repeat."
  - platform: "LinkedIn"
    content: "Looking for advice from fellow IT professionals: how do you maintain quality when quantity is all anyone measures?"

calendar:
  - title: "Doctor appointment — stress-related symptoms"
    time: "Thursday 4:00 PM"
    type: "personal"
  - title: "Overtime — Saturday coverage (no one else available)"
    time: "Saturday 9:00 AM"
    type: "one-time"

emails:
  - from: "Target (Sent)"
    subject: "Re: Access request batch — 8 tickets"
    snippet: "Approved all 8. I spot-checked the first two but I'll be honest — I didn't have time to review each..."
  - from: "Security Audit <audit@company.internal>"
    subject: "Quarterly access review findings"
    snippet: "During our review we identified 3 accounts with access that doesn't match their role. These were..."
