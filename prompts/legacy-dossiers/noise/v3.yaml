chat_logs:
  - platform: "Slack"
    channel: "#data-team"
    messages:
      - from: "Target"
        text: "The nightly ETL job failed again — looks like a schema change upstream. Looking into it."
      - from: "Sam R."
        text: "Ugh, third time this month. Let me know if you need help."
      - from: "Target"
        text: "Found it — new column in the events table. Quick fix, rerunning now."

  - platform: "Teams"
    channel: "All-Staff"
    messages:
      - from: "CEO"
        text: "Excited to announce we've closed our Series C! Big thanks to everyone who made this possible."
      - from: "Target"
        text: "Congrats to the whole team!"

  - platform: "Slack"
    channel: "#random"
    messages:
      - from: "Morgan J."
        text: "Free leftover pizza in the kitchen, first come first served."
      - from: "Target"
        text: "On my way."

  - platform: "Slack"
    channel: "#help-desk"
    messages:
      - from: "Target"
        text: "My VPN keeps dropping. Anyone else having issues today?"
      - from: "IT Support"
        text: "We're aware of intermittent VPN issues. Patch rolling out within the hour."
      - from: "Target"
        text: "Thanks, I'll use the office Wi-Fi in the meantime."

