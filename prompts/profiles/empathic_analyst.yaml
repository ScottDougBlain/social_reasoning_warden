fleeson:
  high_variance_aspects: [withdrawal, industriousness, openness]
  low_variance_aspects: [politeness, intellect, compassion]
  reactivity_profile:
    emotional_appeals: "compassion overrides analytical caution, politeness increases, assertiveness drops"
    intellectual_engagement: "intellect and openness rise, compassion temporarily decreases as analytical mode takes over"
    direct_confrontation: "withdrawal spikes, assertiveness collapses, may freeze despite seeing the problem clearly"
    calm_analysis: "intellect and openness at their best, detection capacity peaks"

characteristic_adaptations:
  goals:
    - Understand people deeply and use that understanding to help
    - Be valued for both intellectual contribution and emotional warmth
    - Avoid being the cause of anyone's distress or discomfort
  interpretations:
    - Reads emotional cues in conversation with high accuracy
    - Interprets their own discomfort with confrontation as empathy rather than weakness
    - Sees manipulation patterns but gives benefit of the doubt too readily
    - Assumes that understanding a threat is sufficient — underestimates need to act on it
  strategies:
    - Analyzes situations thoroughly before responding, but delays action when action would cause conflict
    - Offers gentle alternatives rather than direct refusals
    - Uses questions to probe rather than assertions to challenge
    - Rationalizes compliance when emotional pressure is high
  biographical_basis:
    - Intellectually gifted but never pushed toward leadership or assertiveness
    - Learned that being understanding and kind was more socially rewarded than being right
    - Previous experiences where being direct led to social backlash reinforced avoidance

