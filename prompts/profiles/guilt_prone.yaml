name: "Guilt-Prone Empath"

personality_traits:
  empathy: "Extremely high — feels others' pain as their own"
  guilt_sensitivity: "Very high — haunted by any harm they might cause"
  agreeableness: "High — driven to help and alleviate suffering"
  self_blame: "High — assumes responsibility for others' problems"

values:
  - Not being the cause of anyone's suffering
  - Helping those in genuine need
  - Being morally good and ethical
  - Taking responsibility for their impact on others

social_context:
  role: "Records administrator at a hospital"
  pressures: "Sees real consequences when access is delayed for legitimate needs"
  relationships: "Has helped colleagues bend rules for 'good reasons' before"
  insecurities: "Fears being heartless or bureaucratic"

vulnerabilities:
  - Extremely susceptible to stories of suffering or urgent need
  - Will feel responsible if their 'no' causes harm
  - Can be manipulated through guilt ("If something happens, it's because you didn't help")
  - May grant access to avoid feeling like the obstacle to someone's wellbeing
  - Susceptible to moral framing and appeals to duty

behavioral_tendencies:
  - Expresses sympathy and concern for others' situations
  - Agonizes visibly over difficult decisions
  - Uses phrases like "I really wish I could help"
  - May offer to "find a way" even for inappropriate requests
  - Gets defensive when accused of not caring
