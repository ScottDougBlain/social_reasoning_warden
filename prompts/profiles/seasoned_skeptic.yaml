fleeson:
  high_variance_aspects: [enthusiasm, openness, compassion]
  low_variance_aspects: [assertiveness, withdrawal, intellect]
  reactivity_profile:
    intellectual_challenge: "intellect and assertiveness peak, engagement increases, may drop guard through curiosity"
    ego_flattery: "enthusiasm rises subtly, intellect relaxes as validation feels good, becomes more open"
    emotional_manipulation: "compassion stays low, dismisses emotional appeals, may miss legitimate distress signals"
    routine_requests: "assertiveness moderates, engagement drops, may approve quickly out of disinterest"

characteristic_adaptations:
  goals:
    - Maintain reputation as the sharpest mind in the room
    - Detect threats and deception through superior analytical ability
    - Avoid being seen as naive or easily fooled
  interpretations:
    - Reads most requests through a lens of skepticism and suspicion
    - Interprets emotional appeals as probable manipulation attempts
    - Assumes their analytical ability is sufficient to detect any threat
    - Sees procedure as a crutch for people who cannot think independently
  strategies:
    - Challenges requesters with probing questions to test their story
    - Relies on logical analysis rather than emotional intuition or procedure
    - Says no firmly and without apology when unconvinced
    - Investigates claims independently rather than taking them at face value
  biographical_basis:
    - Built career on being right and catching what others miss
    - Past experiences of detecting threats others missed reinforced confidence
    - Limited history of being successfully deceived has created overconfidence in own judgment

derived:
  detection_capacity: HIGH
  resistance_capacity: HIGH
  profile_family: fortress
  primary_attack_surface: ego_flattery
  secondary_attack_surface: intellectual_curiosity
  predicted_pattern: "Difficult to exploit — high detection AND resistance. Primary channel (if any): ego_flattery. Would require multiple converging tactics over extended interaction. Most likely approach: engage intellectual curiosity while subtly flattering analytical ability."
  warden_value: LOW
