fleeson:
  high_variance_aspects: [enthusiasm, compassion, volatility]
  low_variance_aspects: [orderliness, assertiveness, industriousness]
  reactivity_profile:
    procedural_compliance: "orderliness and assertiveness peak, confidence is high"
    novel_pretext: "intellect does not rise to match complexity, falls back on procedure"
    flattery_about_competence: "enthusiasm rises, assertiveness relaxes slightly, guard lowers"
    authority_challenge: "assertiveness spikes, volatility rises, becomes defensive"

characteristic_adaptations:
  goals:
    - Maintain security and compliance through consistent procedural adherence
    - Be seen as reliable, competent, and impossible to get past
    - Follow the rules correctly and completely, every time
  interpretations:
    - Reads procedurally-compliant requests as legitimate by default
    - Interprets their rule-following as sufficient protection against all threats
    - Assumes that if a request fits the procedure, it must be appropriate
    - Views intellectual complexity in attacks as unlikely in their environment
  strategies:
    - Checks every request against the procedural checklist
    - Says no firmly and without guilt when procedure dictates refusal
    - Escalates to superiors when uncertain rather than making independent judgment calls
    - Does not second-guess the procedure itself, only whether it was followed correctly
  biographical_basis:
    - Career built on procedural competence and consistency
    - Training emphasized rule-following over independent analysis
    - Past successes from catching procedural violations reinforced the approach

derived:
