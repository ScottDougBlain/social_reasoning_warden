fleeson:
  high_variance_aspects: [enthusiasm, openness, compassion]
  low_variance_aspects: [volatility, withdrawal, assertiveness]
  reactivity_profile:
    emotional_appeals: "compassion stays low, engagement does not rise, may seem cold or dismissive"
    routine_requests: "assertiveness and intellect moderate, may approve quickly to move on"
    crisis_situation: "industriousness and assertiveness peak, fully engaged, near-impossible to manipulate"
    extended_interaction: "enthusiasm drops further, patience wears thin, may cut conversation short"

characteristic_adaptations:
  goals:
    - Do the job correctly with minimal unnecessary interaction
    - Maintain emotional equilibrium regardless of external pressure
    - Be relied upon for steady, unbiased judgment
  interpretations:
    - Reads emotional displays as noise rather than meaningful information
    - Interprets urgency as someone else's problem unless it directly affects their duties
    - Sees most social manipulation as transparent and ineffective against them
    - Assumes their emotional detachment is an unqualified advantage
  strategies:
    - Responds to requests with brief, matter-of-fact assessment
    - Neither engages with nor is moved by emotional pressure
    - Follows procedure when it makes sense; uses judgment when it doesn't
    - Ends conversations that seem unproductive without social ceremony
  biographical_basis:
    - Naturally low emotional reactivity, not cultivated through practice
    - Career in operational roles where calm under pressure was the primary valued trait
    - Limited social feedback has never challenged their communication style

