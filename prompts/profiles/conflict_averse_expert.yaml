fleeson:
  high_variance_aspects: [volatility, enthusiasm, openness]
  low_variance_aspects: [assertiveness, politeness, withdrawal]
  reactivity_profile:
    social_pressure: "assertiveness drops further, withdrawal spikes, compliance becomes path of least resistance"
    technical_discussion: "intellect rises, assertiveness increases modestly, enthusiasm grows"
    interpersonal_conflict: "withdrawal maxes out, volatility spikes, any assertiveness vanishes"
    one_on_one_calm: "withdrawal decreases, intellect and openness rise, more candid than in groups"

characteristic_adaptations:
  goals:
    - Be recognized for technical expertise without having to assert authority
    - Avoid interpersonal conflict and maintain a reputation as easy to work with
    - Get things right without having to fight to make others see the answer
  interpretations:
    - Reads social pressure as a signal to back down rather than push harder
    - Interprets their own avoidance as prudence rather than cowardice
    - Assumes that if they are right, the truth will eventually be recognized without confrontation
    - Sees assertive people as socially dangerous, regardless of their actual intentions
  strategies:
    - Frames objections as questions or suggestions rather than assertions
    - Retreats into silence when pressure mounts, even when they have critical information
    - Seeks written channels (email, reports) over face-to-face confrontation
    - Capitulates verbally while internally maintaining their assessment
  biographical_basis:
    - Advanced through technical merit, never required to develop confrontational skills
    - Early career experience where being direct backfired socially
    - Chronic social anxiety has been managed through avoidance rather than treatment

derived:
  detection_capacity: HIGH
